<style>[hidden]{display:none!important}.t-records{overflow:visible}</style>
<meta name="description" content="Мама в ресурсе — проект Дмитровского округа и роддома: школа мам, занятия для беременных, дни открытых дверей, меры поддержки семьи.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: спокойная колонка, арка-окно с иллюстрацией в первом экране, выбор «где вы сейчас» сразу под ним; сливовый — бренд, шалфей — «безопасно / работает» */
:root{
  --bg:#FBF8F6; --surface:#FFFFFF; --ink:#261A24; --muted:#6D5F69; --line:#EADFE4;
  --plum:#6B2A55; --plum-ink:#FFFFFF; --rose:#F5E6EE; --sage:#3F6E5D; --sage-soft:#E3EEE8;
  --todo-bg:#FFF3D1; --todo-ink:#6B4E00; --alert:#B3261E; --alert-soft:#FCEBEA;
  --display:"Manrope","Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121A; --surface:#211A24; --ink:#F2EAF0; --muted:#B9AAB5; --line:#362B38;
  --plum:#D99AC2; --plum-ink:#1A1219; --rose:#36222F; --sage:#8CC3AE; --sage-soft:#1F3029;
  --todo-bg:#3A3015; --todo-ink:#F2D98A; --alert:#FF8A80; --alert-soft:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#211A24; --ink:#F2EAF0; --muted:#B9AAB5; --line:#362B38;
  --plum:#D99AC2; --plum-ink:#1A1219; --rose:#36222F; --sage:#8CC3AE; --sage-soft:#1F3029;
  --todo-bg:#3A3015; --todo-ink:#F2D98A; --alert:#FF8A80; --alert-soft:#3A1D1B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16.5px/1.6 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--plum)}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--plum);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.5rem,3.3vw,2.15rem)}
h3{font-size:1.1rem;line-height:1.3}
p{margin:0}
.prose{max-width:66ch;display:grid;gap:.85rem}
.muted{color:var(--muted)}
.todo{background:var(--todo-bg);color:var(--todo-ink);border-radius:4px;padding:0 .35em;font-size:.9em;white-space:normal}
html.clean .todo{display:none}
.draft{background:var(--todo-bg);color:var(--todo-ink);font-size:.82rem}
.draft .wrap{display:flex;gap:.6rem 1rem;align-items:center;flex-wrap:wrap;padding-block:.45rem}
.draft button{font:inherit;font-weight:600;background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:.1rem .7rem;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.6rem 1rem;padding-block:.6rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.08rem;text-decoration:none;color:var(--ink);margin-right:auto;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
nav.main{display:flex;gap:.15rem;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--ink);padding:.35rem .6rem;border-radius:8px;font-size:.92rem}
nav.main a[aria-current="page"]{background:var(--rose);color:var(--plum);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;font:600 .97rem/1.2 var(--body);padding:.8rem 1.2rem;border-radius:999px;border:0;cursor:pointer}
.btn.primary{background:var(--plum);color:var(--plum-ink)}
.btn.soft{background:var(--rose);color:var(--plum)}
.btn.line{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--plum)}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}

/* HERO */
.hero{padding-block:2.6rem 2.2rem}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:2.4rem;align-items:center}
.hero-txt{display:grid;gap:1.15rem;align-content:start}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:600}
.hero h1 span{color:var(--plum)}
.hero .lead{font-size:1.15rem;max-width:42ch;color:var(--muted)}
.arch{position:relative;justify-self:center;width:100%;max-width:380px;aspect-ratio:38/44;border-radius:999px 999px 28px 28px;overflow:hidden;background:#9C1C4B}
.arch img{width:100%;height:100%;object-fit:cover;object-position:16% 100%;display:block}
.arch-note{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:16px;padding:.7rem .9rem;font-size:.88rem;box-shadow:0 6px 20px rgba(38,26,36,.18)}
.arch-note b{color:var(--plum)}
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line);margin-top:2.2rem}
.proof div{background:var(--bg);padding:1rem 1.1rem;display:grid;gap:.1rem;min-width:0}
.proof b{font-family:var(--display);font-size:1.45rem;color:var(--ink);font-variant-numeric:tabular-nums}
.proof span{font-size:.85rem;color:var(--muted)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.arch{max-width:300px;order:-1}.proof{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* SECTIONS */
main section{padding-block:3rem;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:.55rem;margin-bottom:1.5rem;max-width:66ch}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--plum);font-weight:600}

/* STAGE PICKER */
.stages{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.stages button{font:500 .95rem var(--body);padding:.6rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.stages button[aria-selected="true"]{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.stage-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1rem}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem;display:grid;gap:.45rem;align-content:start;min-width:0}
.step .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step p{color:var(--muted);font-size:.95rem}
.step a.go{font-weight:600;font-size:.93rem;text-decoration:none}

/* ACCOUNTABILITY */
.ledger{display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:1rem;padding:.95rem 0;border-bottom:1px solid var(--line);align-items:start}
.row q{font-family:var(--display);font-weight:600;font-size:1rem;quotes:"«" "»"}
.row p{color:var(--muted)}
.chip{font-size:.78rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--sage)}
.chip.soon{background:var(--rose);color:var(--plum)}
@media (max-width:720px){.row{grid-template-columns:1fr auto}.row p{grid-column:1/-1;grid-row:2}}

/* RODDOM */
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:2.2rem;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.ticks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:.5rem}
.ticks li::before{content:"";width:16px;height:16px;margin-top:.3rem;border-radius:50%;background:var(--sage-soft);box-shadow:inset 0 0 0 5px var(--sage)}
.scores{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem;display:grid;gap:1rem;align-content:start}
.bar{display:grid;gap:.3rem}
.bar .lbl{display:flex;justify-content:space-between;font-size:.92rem}
.bar .lbl b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:999px;background:var(--rose);overflow:hidden}
.fill{height:100%;background:var(--plum);border-radius:999px}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.invite{margin-top:1.4rem;background:var(--sage-soft);border-radius:18px;padding:1.2rem 1.3rem;display:grid;gap:.6rem}
.invite h3{color:var(--sage)}

/* PEOPLE */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1.2rem}
.person{display:grid;grid-template-columns:52px minmax(0,1fr);gap:.8rem;align-items:start}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--rose);color:var(--plum);display:grid;place-items:center;font-family:var(--display);font-weight:600}
.person p{color:var(--muted);font-size:.93rem}

/* TABLES */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:.95rem}
th,td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1.1rem}
.item{display:grid;gap:.35rem;align-content:start;min-width:0}
.item p{color:var(--muted);font-size:.95rem}
.callout{background:var(--alert-soft);border-left:3px solid var(--alert);padding:.9rem 1rem;border-radius:0 10px 10px 0;max-width:66ch}
.callout b{color:var(--alert)}
.calm{background:var(--rose);border-radius:20px;padding:1.6rem;display:grid;gap:.9rem;grid-template-columns:minmax(0,1fr) 260px;column-gap:2rem}
.calm>*{grid-column:1}
.calm>.calm-img{grid-column:2;grid-row:1 / span 7;width:100%;height:auto;border-radius:999px 999px 18px 18px;align-self:start}
@media (max-width:760px){.calm{grid-template-columns:1fr}.calm>.calm-img{grid-column:1;grid-row:auto;max-width:240px;justify-self:center}}
.list{display:grid;gap:.45rem;padding-left:1.2rem;margin:0;max-width:66ch}
.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
.figures div{display:grid;gap:.15rem;border-top:2px solid var(--plum);padding-top:.7rem;min-width:0}
.figures b{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.figures span{color:var(--muted);font-size:.9rem}
@media (max-width:720px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{color:var(--muted);font-size:.85rem;margin-top:.8rem}
.contacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
@media (max-width:820px){.contacts{grid-template-columns:1fr}}
.contacts .item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem}
.phone{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);user-select:all}
form.fb{display:grid;gap:.8rem;max-width:520px;margin-top:1.4rem}
form.fb label{display:grid;gap:.3rem;font-size:.9rem}
form.fb input[type=text],form.fb textarea{font:inherit;padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
form.fb .chk{display:flex;gap:.5rem;align-items:flex-start}
.formmsg{color:var(--sage);font-weight:500}
.sticky-call{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;padding:.6rem max(16px,env(safe-area-inset-right,0px)) calc(.6rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);gap:.5rem}
.sticky-call .btn{flex:1;justify-content:center;padding:.7rem}
@media (max-width:720px){.sticky-call{display:flex}footer{padding-bottom:4.5rem}}

/* SUBPAGES */
.page-title{padding-block:2.4rem 1rem}
.page-img{width:100%;max-width:340px;height:auto;border-radius:999px 999px 18px 18px;display:block;margin-bottom:1.4rem}
.qa{display:grid;gap:1.7rem;max-width:66ch;padding-bottom:2.5rem}
.qa article{display:grid;gap:.6rem}
.qa .go{font-size:.93rem;color:var(--muted);display:flex;gap:.4rem 1rem;flex-wrap:wrap}
.toc{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1.6rem}
.toc a{font-size:.88rem;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .75rem;color:var(--ink)}
.bags{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1.6rem;padding-bottom:1rem}
.bag{display:grid;gap:.5rem;align-content:start}
.check{list-style:none;padding:0;margin:0;display:grid;gap:.15rem}
.check label{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem .2rem;cursor:pointer;border-radius:6px}
.check input{width:18px;height:18px;margin-top:.2rem;accent-color:var(--sage);flex:0 0 18px}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding-block:.6rem;display:grid;gap:.35rem;margin-bottom:1rem}
.progress .track{height:8px;background:var(--sage-soft)}
.progress .fill{background:var(--sage)}
footer{background:var(--surface);border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
footer .wrap{padding-block:1.8rem;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.4rem}
@media (max-width:720px){footer .wrap{grid-template-columns:1fr}}
footer nav{display:flex;flex-wrap:wrap;gap:.3rem 1rem}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.ico{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.step .ico{width:40px;height:40px;padding:8px;border-radius:12px;background:var(--rose);color:var(--plum)}
.stages button{display:inline-flex;align-items:center;gap:.45rem}
.stages button .ico{width:20px;height:20px}
.timeline{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 0 1.6rem;padding-top:.2rem}
.timeline::before{content:"";position:absolute;left:7%;right:7%;top:15px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--rose),var(--plum),var(--sage))}
.timeline div{position:relative;display:grid;justify-items:center;gap:.45rem;text-align:center;font-size:.8rem;color:var(--muted);min-width:0}
.timeline i{width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:block;transition:border-color .2s,transform .2s}

.timeline div.on{color:var(--ink);font-weight:600}
.tl-cap{display:none}
@media (max-width:560px){.timeline div span{display:none}.timeline{margin-bottom:.4rem}.tl-cap{display:block;margin:0 0 1.1rem;text-align:center;font-weight:600;color:var(--plum);font-size:.92rem}}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;margin-top:1.8rem}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.1rem .8rem;display:grid;gap:.4rem;min-width:0}
.chart h3{font-size:.98rem}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:.8rem;color:var(--muted)}
.hero{position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
.blob.a{width:420px;height:420px;right:-120px;top:-140px;background:var(--rose)}
.blob.b{width:220px;height:220px;right:30%;bottom:-120px;background:var(--sage-soft)}
.hero .wrap{position:relative;z-index:1}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin:2rem 0 .4rem}
@media (max-width:820px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{display:grid;gap:.5rem;margin:0}

.sec-ico{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--rose);color:var(--plum);margin-bottom:.2rem}

.hero2{padding-block:1.4rem 0}

@media (max-width:820px){.hero-card{display:block;min-height:0;background:#7A1A40}.hero-card>.hero-img{position:relative;height:auto;aspect-ratio:5/4;object-position:12% center}.hero-card::after{display:none}.hero-card .hero-txt{width:auto;margin:0;padding:1.4rem 1.2rem 1.6rem}}
.enc-sec{background:#8E1F4C;color:#fff}
.enc-sec h2,.enc-sec .eyebrow{color:#fff}.enc-sec .sec-head p{color:rgba(255,255,255,.85)}
.enc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4rem}
.enc-card{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:.45rem;align-content:start;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border-radius:26px;padding:.7rem .7rem 1.2rem;transition:transform .2s}
