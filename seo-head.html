<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Мне страшно рожать", "acceptedAnswer": {"@type": "Answer", "text": "Это самый частый страх. Лучший способ его снять — увидеть роддом заранее и познакомиться с врачами. Приходите на день открытых дверей в четверг: заведующий отделением проведёт экскурсию по родовому и послеродовому отделениям. На школе мам расскажут, как дышать и вести себя в схватках."}}, {"@type": "Question", "name": "Как выбрать роддом", "acceptedAnswer": {"@type": "Answer", "text": "Смотрите на условия, а не только на расстояние. В Дмитровском роддоме — индивидуальные родовые боксы, одноместные палаты, «Золотой час» и бесплатные партнёрские роды. Средняя оценка мамами — 8,78 из 10."}}, {"@type": "Question", "name": "Какие документы нужны", "acceptedAnswer": {"@type": "Answer", "text": "Паспорт, полис ОМС, СНИЛС, обменная карта и родовой сертификат (если есть — сейчас он в основном электронный). Рубашку на роды, сорочку и халат выдаст роддом."}}, {"@type": "Question", "name": "Когда срочно ехать в роддом", "acceptedAnswer": {"@type": "Answer", "text": "Памятка роддома. Не ждите, приезжайте сразу, если: Появились кровянистые выделения — даже небольшие. Излились или подтекают околоплодные воды — сильным потоком или понемногу, но постоянно. Малыш стал двигаться заметно меньше, слабее или вы его не чувствуете. Сильная или постоянная боль в животе — особенно если нарастает, живот напряжён. Сильная головная боль, «мушки» перед глазами, ухудшилось зрение — так может проявляться опасное повышение давления. Температура 38° и выше, озноб, слабость, рвота, одышка. Начались регулярные болезненные схватки при сроке 37 недель и больше. Вы упали или ударились животом — даже если всё кажется в порядке. Сразу звоните 112 , если обильное кровотечение, потеря сознания, судороги, резко стало трудно дышать или сильная боль в груди, состояние быстро ухудшается. Если сомневаетесь — лучше приехать и убедиться, что всё хорошо. Приёмное отделение: 8 (496) 223-2"}}, {"@type": "Question", "name": "Какие выплаты мне положены", "acceptedAnswer": {"@type": "Answer", "text": "Оформить выплаты при рождении ребёнка можно онлайн через Госуслуги Подмосковья. Если не понимаете, что положено именно вам, — напишите в контакт-центр «Остров Надежды»."}}, {"@type": "Question", "name": "Не получается наладить грудное вскармливание", "acceptedAnswer": {"@type": "Answer", "text": "Почти каждая мама в первые недели думает, что молока мало, — и чаще всего это не так. Первые дни малышу хватает молозива: желудок у него совсем маленький. За первый месяц лактация подстраивается под ребёнка, лучше всего помогает кормление по требованию. Настоящие признаки нехватки — мало мокрых подгузников, редкий стул и плохая прибавка в весе. Даже тогда не переходите сразу на смесь: сначала к педиатру и к консультанту по ГВ — часто дело в прикладывании."}}, {"@type": "Question", "name": "Что нормально после родов, а когда ехать в роддом", "acceptedAnswer": {"@type": "Answer", "text": "Послеродовой период длится 42 дня. Выделения (лохии) в норме идут до шести недель: сначала кровяные, через неделю — слизистые. Душ можно принимать уже в первые сутки, в том числе после кесарева; шов и рубец достаточно мыть с мылом и сушить, зелёнка и пластырь не нужны. Приезжайте в роддом, если выделений больше, чем в первые дни месячных, есть сгустки, они ярко-алые, снова стали обильными после затихания или неприятно пахнут. Если за 6 часов после родов не удаётся помочиться — скажите врачу. При любых жалобах в течение 42 дней можно и нужно приехать в роддом."}}, {"@type": "Question", "name": "Когда с малышом срочно к врачу", "acceptedAnswer": {"@type": "Answer", "text": "В большинстве случаев достаточно наблюдать. Но к врачу нужно сразу, если малыш: стал вялым, отказывается от груди или плохо сосёт; часто и обильно срыгивает (больше 5 раз в день), беспокоен, не прибавляет в весе; пожелтел сильнее, побледнел или посинел; температура выше 37,5 °C, и малыш вялый или беспокойный; редко мочится, стул плотный, сухой или тёмный; из пупка выделения с гноем или кровью, неприятный запах, покраснение вокруг; пупочная ранка не заживает больше 21 дня."}}, {"@type": "Question", "name": "Мне плохо после родов, и я не понимаю почему", "acceptedAnswer": {"@type": "Answer", "text": "Если больше двух недель держатся подавленность и слёзы, потеря интереса ко всему, сильная тревога, бессонница даже когда малыш спит, чувство вины и никчёмности — это может быть перинатальная депрессия. Это не слабость и не «плохая мать». Она хорошо лечится, если обратиться вовремя. Если появились мысли причинить вред себе или ребёнку — обратитесь за помощью в тот же день: контакт-центр «Остров Надежды» — +7 (496) 223-24-54 , экстренная помощь — 112 . Близким: не ждите, пока мама пожалуется сама. Спросите, как она себя чувствует, и помогите дойти до специалиста."}}, {"@type": "Question", "name": "Я всё время одна, не с кем поговорить", "acceptedAnswer": {"@type": "Answer", "text": "В чате роддома 4267 мам. Там можно спросить совет у тех, кто уже прошёл этот путь, и найти подругу для прогулок. На занятиях в роддоме — очные встречи."}}, {"@type": "Question", "name": "Не могу записаться к врачу", "acceptedAnswer": {"@type": "Answer", "text": "Напишите в чат роддома — там есть связь с регистратурой. Подсказать, куда обратиться, может и ИИ-помощник «Мама» в Max."}}, {"@type": "Question", "name": "Как устроить ребёнка в детский сад и вернуться на работу", "acceptedAnswer": {"@type": "Answer", "text": "Каждый ребёнок от 2 месяцев до 8 лет имеет право на место в муниципальном саду. Заявление подаётся онлайн через Госуслуги. В 2027 году в Дмитрове планируется достроить сад на 130 мест на ул. Большевистской."}}, {"@type": "Question", "name": "Когда выписка?", "acceptedAnswer": {"@type": "Answer", "text": "После естественных родов — на третьи сутки, после кесарева сечения — на четвёртые."}}, {"@type": "Question", "name": "Можно ли навестить маму?", "acceptedAnswer": {"@type": "Answer", "text": "Посещений в роддоме нет. Передачи принимаются круглосуточно через приёмное отделение."}}, {"@type": "Question", "name": "Можно ли рожать с мужем, мамой или подругой?", "acceptedAnswer": {"@type": "Answer", "text": "Да, партнёрские роды бесплатны по ОМС. Партнёру нужны флюорография не старше 1 года и анализ на антитела к кори или справка о прививке не старше полугода."}}, {"@type": "Question", "name": "Что такое неонатальный скрининг?", "acceptedAnswer": {"@type": "Answer", "text": "Анализ крови из пяточки на наследственные заболевания, берут в роддоме на 1–2 сутки (у недоношенных — на 7-е). Если всё в порядке, родителям не звонят; при отклонениях поликлиника сама направит на повторное обследование."}}, {"@type": "Question", "name": "Какие осмотры нужны малышу до года?", "acceptedAnswer": {"@type": "Answer", "text": "Ежемесячно педиатр; в 1 месяц — невролог, хирург, офтальмолог, стоматолог, УЗИ и аудиоскрининг; в 3 месяца — ортопед; в 12 месяцев — расширенный осмотр."}}]}</script>
